# cargo-deny configuration — validate locally with `cargo deny check`.
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# A yanked crate in the lockfile is a hard failure; bump it instead of ignoring.
yanked = "deny"
# Add RUSTSEC ids here (with a reason and an upstream link) only while a bump is
# in flight, and remove them as soon as the fix lands.
ignore = [
    # ringbuf 0.3.3: `Consumer::skip()`/`clear()` are not panic-safe when an
    # element's `Drop` panics (CWE-415/416). Fixed in ringbuf >= 0.5.2.
    # Not reachable here: the only ring payloads are `f32` and the plain
    # `AutomationCommand` enum (f32 fields, no `Drop`), which cannot panic on
    # drop. Tracked for upgrade via the dependabot ringbuf PR.
    { id = "RUSTSEC-2026-0293", reason = "ringbuf 0.3.3; ring payloads (f32, AutomationCommand) have no panicking Drop" },
]

[licenses]
version = 2
# Allow permissive licenses only. `MIT OR Apache-2.0` crates satisfy either
# clause, so both are listed; MPL-2.0 (symphonia) is file-level copyleft and is
# safe to link against.
confidence-threshold = 0.9
# Keep the allow-list forward-looking without emitting a warning per entry that
# the current dependency graph happens not to use.
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Workspace crates marked `publish = false` (integration tests, xtask) are not
# distributed, so their license headers are not policed here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
# Add duplicate-version entries here (with a reason) when a transitive crate
# has to stay pinned for a while.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
