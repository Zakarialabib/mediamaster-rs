[workspace]
members = ["crates/*", "xtask"]

resolver = "2"

[workspace.package]
rust-version = "1.95"
edition = "2021"
license = "Apache-2.0"
authors = ["SignageMaster Team <team@signage-master.example.com>"]
repository = "https://github.com/Zakarialabib/mediamaster-rs"

[workspace.dependencies]
tokio = { version = "1", features = ["sync", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.2"
