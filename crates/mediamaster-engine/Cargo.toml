[package]
name = "mediamaster-engine"
version = "0.3.0"
description = "Engine coordinator: AudioBus (lock-free PCM ring) + TranscodePlan (capability-decision) + EngineSelector (backend pick)"
authors = ["SignageMaster Team <team@signage-master.example.com>"]
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[features]
default = ["hls"]
hls = ["dep:mediamaster-frame"]

[dependencies]
mediamaster-core = { path = "../mediamaster-core", version = "0.3.0" }
mediamaster-bus = { path = "../mediamaster-bus", version = "0.3.0" }
mediamaster-audio = { path = "../mediamaster-audio", version = "0.3.0" }
mediamaster-rf = { path = "../mediamaster-rf", version = "0.3.0" }
mediamaster-sensors = { path = "../mediamaster-sensors", version = "0.3.0" }
mediamaster-probe = { path = "../mediamaster-probe", version = "0.3.0" }
mediamaster-codec = { path = "../mediamaster-codec", version = "0.3.0" }
mediamaster-frame = { path = "../mediamaster-frame", version = "0.3.0", optional = true }
ringbuf = { version = "0.3", features = ["alloc"] }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.12.0"

[lib]
name = "mediamaster_engine"
path = "src/lib.rs"

[[example]]
name = "segment_to_memory"
required-features = ["hls"]

[[test]]
name = "hls_tests"
required-features = ["hls"]
