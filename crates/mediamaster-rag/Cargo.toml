[package]
name = "mediamaster-rag"
version = "0.4.0"
description = "Acoustic profiles, codec matrix & sensor-context knowledge store for mediamaster-rs"
authors = ["SignageMaster Team <team@signage-master.example.com>"]
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Zakarialabib/mediamaster-rs"
keywords = ["rag", "codec", "audio", "sensors", "knowledge-base"]

[dependencies]
mediamaster-core = { path = "../mediamaster-core", version = "0.4.0", features = ["serde-sync"] }
mediamaster-codec = { path = "../mediamaster-codec", version = "0.4.0" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
toml = "0.8"

[dev-dependencies]
mediamaster-audio = { path = "../mediamaster-audio", version = "0.4.0" }

[lib]
name = "mediamaster_rag"
path = "src/lib.rs"
