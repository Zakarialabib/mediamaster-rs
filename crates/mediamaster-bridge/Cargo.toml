[package]
name = "mediamaster-bridge"
version = "0.1.0"
description = "Bridge crate: unified API for mediamaster-rs domains (audio + sensors + rf) with device enumerators and event handlers"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
# Forwarded to the domain crate so `cargo --all-features` (CI) enables the
# same `cpal` output path the other crates use.
audio-cpal = ["mediamaster-audio/audio-cpal"]

[dependencies]
mediamaster-core = { path = "../mediamaster-core", version = "0.3.0" }
mediamaster-bus = { path = "../mediamaster-bus", version = "0.3.0" }
mediamaster-audio = { path = "../mediamaster-audio", version = "0.2.0" }
mediamaster-sensors = { path = "../mediamaster-sensors", version = "0.2.0" }
mediamaster-rf = { path = "../mediamaster-rf", version = "0.2.0" }

tokio = { workspace = true, features = ["sync", "macros"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
# Tests only: `#[tokio::test]` + spawn + sleep. The library itself stays on
# `sync`/`macros` (the `run` loop just awaits a broadcast receiver).
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
