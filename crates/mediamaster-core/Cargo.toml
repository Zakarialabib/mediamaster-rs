[package]
name = "mediamaster-core"
version = "0.4.0"
description = "Shared vocabulary (traits, types, caps) for the mediamaster-rs ecosystem — alloc-only, no_std, tokio-free"
authors = ["SignageMaster Team <team@signage-master.example.com>"]
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/mediamaster-core"
keywords = ["audio", "sdr", "sensors", "traits", "events"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
# Opt-in serde derives for the shared types (off by default so core stays
# alloc-only with no serializer pulled in unless the host needs it).
serde-sync = ["dep:serde"]

[dependencies]
libm = "0.2"
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }

[lib]
name = "mediamaster_core"
path = "src/lib.rs"
